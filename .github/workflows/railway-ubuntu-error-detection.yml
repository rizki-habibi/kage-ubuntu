name: Railway Ubuntu Error Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: railway-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ubuntu Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f start.sh

      - name: Validate Dockerfile and startup script
        shell: bash
        run: |
          set -euo pipefail

          grep -q '^FROM ubuntu:24.04' Dockerfile
          grep -q 'ENTRYPOINT' Dockerfile
          grep -q 'x11-utils' Dockerfile
          grep -q 'firefox.tar.xz' Dockerfile
          grep -q 'tar -xJf' Dockerfile
          ! grep -Eq '\\bfirefox-esr\\b' Dockerfile

          bash -n start.sh
          grep -q 'PORT=${PORT:-8080}' start.sh
          grep -q 'Xvfb' start.sh
          grep -q 'xdpyinfo' start.sh
          grep -q 'x11vnc' start.sh
          grep -q 'websockify' start.sh
          grep -q '/vnc.html' start.sh

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --progress=plain -t max-ubuntu-ci:latest .

      - name: Smoke test desktop container
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run -d --name max-ubuntu-smoke -e PORT=8080 -p 18080:8080 max-ubuntu-ci:latest

          cleanup() {
            docker logs max-ubuntu-smoke || true
            docker rm -f max-ubuntu-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/vnc.html >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' max-ubuntu-smoke 2>/dev/null | grep -q true; then
              echo "::error::Container berhenti sebelum noVNC siap."
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::noVNC tidak merespons pada PORT 8080."
            exit 1
          fi

          echo "Ubuntu desktop smoke test OK."

  railway-logs:
    name: Detect Railway Errors
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Read failed Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: 33792731-b4ce-4d44-9ee6-4ab970366d50
          SERVICE: max-ubuntu
          ENVIRONMENT: production
          DEPLOYMENT_ID: ${{ github.event.deployment_status.deployment_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::RAILWAY_TOKEN belum tersedia; validasi Docker tetap berjalan, tetapi log Railway tidak dapat dibaca dari GitHub Actions."
            exit 0
          fi

          railway logs "${DEPLOYMENT_ID}" --project "${PROJECT_ID}" --service "${SERVICE}" --environment "${ENVIRONMENT}" --lines 500 --json > railway-deploy.json || true
          railway logs "${DEPLOYMENT_ID}" --project "${PROJECT_ID}" --service "${SERVICE}" --environment "${ENVIRONMENT}" --build --lines 500 --json > railway-build.json || true
          railway logs "${DEPLOYMENT_ID}" --project "${PROJECT_ID}" --service "${SERVICE}" --environment "${ENVIRONMENT}" --http --lines 200 --json > railway-http.json || true

          echo "===== RAILWAY DEPLOY LOG ====="
          cat railway-deploy.json || true
          echo "===== RAILWAY BUILD LOG ====="
          cat railway-build.json || true
          echo "===== RAILWAY HTTP LOG ====="
          cat railway-http.json || true

      - name: Detect known Railway errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          touch railway-deploy.json railway-build.json railway-http.json
          cat railway-deploy.json railway-build.json railway-http.json > railway-all.log

          echo "===== DETECTED ERROR PATTERNS ====="

          grep -Eiq 'bzip2.*not a bzip2|tar.*error.*not recoverable' railway-all.log &&             echo "::error::Firefox archive mismatch: unduhan Mozilla sekarang TAR.XZ, bukan TAR.BZ2." || true

          grep -Eiq 'healthcheck|service unavailable|failed to respond|502|503|504' railway-all.log &&             echo "::error::Railway healthcheck/service error terdeteksi." || true

          grep -Eiq 'apt.*exit code: 100|dpkg.*error|command.*not found|no installation candidate' railway-all.log &&             echo "::error::Linux package/runtime error terdeteksi." || true

          grep -Eiq 'permission denied|cannot open display|DISPLAY.*not set|Xvfb.*failed|x11vnc.*failed|websockify.*failed|noVNC' railway-all.log &&             echo "::error::Desktop/X11/noVNC startup error terdeteksi." || true

          grep -Eiq 'ERROR|FATAL|CRASHED|FAILED|exit code' railway-all.log &&             echo "::warning::Railway log mengandung error/failure. Lihat artifact untuk detail lengkap." || true

      - name: Upload Railway logs
        uses: actions/upload-artifact@v4
        with:
          name: railway-ubuntu-error-logs
          path: |
            railway-deploy.json
            railway-build.json
            railway-http.json
            railway-all.log
          if-no-files-found: ignore
          retention-days: 14

  success-check:
    name: Final Check
    needs: [validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "::error::Validasi Ubuntu Desktop gagal."
            exit 1
          fi
          echo "Ubuntu Desktop validation OK."
